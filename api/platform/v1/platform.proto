syntax = "proto3";

package platform.v1;

option go_package = "open_live_platform/api/platform/v1;platformv1";

service PlatformService {
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
}

service UserDirectoryService {
  rpc GetUser(GetUserRequest) returns (DirectoryUser);
}

message GetUserRequest {
  int64 id = 1;
}

message DirectoryUser {
  int64 id = 1;
  string email = 2;
  string name = 3;
  string display_name = 4;
  string search_name = 5;
  string language = 6;
  string photo = 7;
  string banner = 8;
  bool is_anchor = 9;
  int32 status = 10;
}

message GetStatsRequest {}

message GetStatsResponse {
  int64 users = 1;
  repeated Room rooms = 2;
}

message Room {
  int64 id = 1;
  int64 owner_id = 2;
  string title = 3;
  bool online = 4;
  int64 member_count = 5;
  bool is_lock = 6;
}
